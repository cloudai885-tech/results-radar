name: History study
on:
  workflow_dispatch: # started by hand, about once every 3 months

permissions:
  contents: write

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node backtest.mjs
      - run: node train-model.mjs
      - name: Save the rating cutoffs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/backtest.json data/model.json
          git commit -m "Update rating cutoffs" || echo "No change"
          git push

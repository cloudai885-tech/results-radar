name: News picks (morning, paper test)
on:
  schedule:
    # Morning list: read + grade overnight news (takes ~15-20 min). Several start times because GitHub timers run late.
    # Early, because GitHub timers ran up to ~75 min late on Nov 17 and TODAY'S BUY needs this list by 9:02.
    - cron: '0 1 * * 1-5'  # 6:30 am India time
    - cron: '30 1 * * 1-5' # 7:00 am
    - cron: '0 2 * * 1-5'  # 7:30 am
    # Pre-open (9:04-9:08): strong news + pre-open price +5..+15% -> BUY AT OPEN alert.
    - cron: '15 3 * * 1-5' # 8:45 am (waits inside for 9:04)
    - cron: '25 3 * * 1-5' # 8:55 am
    # 9:30 check: which of them still hold above the open and yesterday's close -> BUY alert.
    - cron: '1 4 * * 1-5'  # 9:31 am
    - cron: '6 4 * * 1-5'  # 9:36 am
    - cron: '12 4 * * 1-5' # 9:42 am
  workflow_dispatch:
    inputs:
      step:
        description: 'morning or confirm'
        default: 'morning'

concurrency:
  group: news-picks
  cancel-in-progress: false # later starts wait, then see the step is done and stop

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Pick the step from the time of day
        id: step
        run: |
          if [ -n "${{ github.event.inputs.step }}" ]; then echo "step=${{ github.event.inputs.step }}" >> $GITHUB_OUTPUT; exit 0; fi
          H=$(TZ=Asia/Kolkata date +%H%M)
          if [ "$H" -lt 0840 ]; then echo "step=morning" >> $GITHUB_OUTPUT
          elif [ "$H" -lt 0925 ]; then echo "step=preopen" >> $GITHUB_OUTPUT
          else echo "step=confirm" >> $GITHUB_OUTPUT; fi
      - run: node news-picks.mjs ${{ steps.step.outputs.step }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

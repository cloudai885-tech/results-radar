name: Panic rebound (morning, watch only)
on:
  schedule:
    # GitHub often starts scheduled jobs late (or skips one), so there are 4 start times from 8:40 am India time.
    # The first one to start waits for pre-open prices (~9:04) and alerts; the others see it already ran and stop.
    # Started early: GitHub timers ran up to ~75 min late on Nov 17. The job waits inside for pre-open (9:04).
    - cron: '0 2 * * 1-5'  # 7:30 am
    - cron: '30 2 * * 1-5' # 8:00 am
    - cron: '50 2 * * 1-5' # 8:20 am
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: panic-rebound
  cancel-in-progress: false # later starts wait for the running one, then exit

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node panic.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      # Keep the pre-open book (buy/sell quantities at the auction) on its own branch for future research.
      - name: Save the pre-open book to the preopen-data branch
        if: always()
        run: |
          ls data/preopen/*.json >/dev/null 2>&1 || { echo "No pre-open book today"; exit 0; }
          mkdir -p /tmp/book && cp data/preopen/*.json /tmp/book/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin preopen-data && git switch preopen-data || git switch --orphan preopen-data
          git rm -rq --cached . 2>/dev/null || true
          mkdir -p preopen && cp /tmp/book/*.json preopen/
          git add -f preopen/*.json
          git commit -m "Pre-open book $(date -u +%F)" || echo "No change"
          git push origin preopen-data

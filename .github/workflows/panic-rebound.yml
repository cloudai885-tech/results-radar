name: Panic rebound (morning, watch only)
on:
  schedule:
    - cron: '20 3 * * 1-5' # 8:50 am India time; the job waits for pre-open prices (~9:04), GitHub timers often run late
    - cron: '30 3 * * 1-5' # 9:00 am backup; does nothing if the first run already alerted
  workflow_dispatch:

concurrency:
  group: panic-rebound
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node panic.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

name: Panic rebound (morning, watch only)
on:
  schedule:
    # GitHub often starts scheduled jobs late (or skips one), so there are 4 start times from 8:40 am India time.
    # The first one to start waits for pre-open prices (~9:04) and alerts; the others see it already ran and stop.
    - cron: '10 3 * * 1-5' # 8:40 am
    - cron: '17 3 * * 1-5' # 8:47 am
    - cron: '24 3 * * 1-5' # 8:54 am
    - cron: '31 3 * * 1-5' # 9:01 am
  workflow_dispatch:

concurrency:
  group: panic-rebound
  cancel-in-progress: false # later starts wait for the running one, then exit

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node panic.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

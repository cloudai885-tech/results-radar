name: Live news radar (BUY NOW / SELL NOW, paper test)
on:
  schedule:
    # One run lasts up to ~5h50 (GitHub's limit is 6h), so a 2nd run takes over in the afternoon.
    # Extra start times because GitHub timers run late; a run that finds another one going waits, then continues the day.
    - cron: '30 2 * * 1-5'  # 8:00 am India time (waits; watches from 9:15)
    - cron: '0 3 * * 1-5'   # 8:30 am (backup)
    # The afternoon run queues behind the morning one and takes over when it ends (~5h45 after it started).
    - cron: '30 5 * * 1-5'  # 11:00 am
    - cron: '0 6 * * 1-5'   # 11:30 am
    - cron: '30 6 * * 1-5'  # 12:00 pm
  workflow_dispatch:
    inputs:
      test:
        description: "Test only: Claude reads today's last filings and sends the grades to the phone"
        type: boolean
        default: true

concurrency:
  group: live-radar-${{ github.event_name }} # a manual test never waits behind the all-day run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node live-radar.mjs ${{ github.event.inputs.test == 'true' && 'test' || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

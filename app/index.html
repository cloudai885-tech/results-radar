<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">
  <title>Results Radar</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <img src="icons/icon-192.png" alt="" width="36" height="36">
        <div>
          <h1>Results Radar</h1>
          <p id="updated">Loading...</p>
        </div>
      </div>
      <div class="tabs" role="tablist">
        <button type="button" id="tab-results" role="tab" aria-selected="true">Results</button>
        <button type="button" id="tab-gap" role="tab" aria-selected="false">Gap &amp; Go</button>
        <button type="button" id="tab-ipo" role="tab" aria-selected="false">IPOs</button>
      </div>
    </div>
  </header>
  <main>
    <div id="view-results" class="layout">
      <aside id="side"></aside>
      <section class="list">
        <nav id="filters" class="filters" aria-label="Filter by rating"></nav>
        <div id="days"></div>
      </section>
    </div>
    <div id="view-gap" class="ipo-page" hidden></div>
    <div id="view-ipo" class="ipo-page" hidden></div>
  </main>
  <footer>Ratings come from past numbers and past price moves. They are not a guarantee, so always use your stop-loss.</footer>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
